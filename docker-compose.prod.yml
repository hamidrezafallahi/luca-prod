# =============================================================================
# Production Environment
# =============================================================================
# Run: docker compose -f docker-compose.prod.yml up -d
# All container env vars come from .env via env_file (see .env.example).
# Compose still interpolates ${VAR} from the project .env for ports/images/commands.
# =============================================================================

services:
  # ─── PostgreSQL ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: shop-postgres-prod
    env_file:
      - .env
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    networks:
      - shop-network-prod
    restart: unless-stopped
    stop_grace_period: 2m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-OnlineShopDb}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1"
        reservations:
          memory: 512M
  # ─── Backend (ASP.NET) ──────────────────────────────────────────────────────
  backend:
    image: ${DOCKER_USERNAME:-hamidrezafalahi}/shop-backend:${BACKEND_IMAGE_TAG}
    container_name: shop-backend-prod
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    env_file:
      - .env
    volumes:
      - uploads_prod:/app/wwwroot/uploads
      - backups_prod:/app/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - shop-network-prod
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "1.0"
        reservations:
          memory: 256M
          cpus: "0.5"
  # ─── Frontend (Next.js) ─────────────────────────────────────────────────────
  frontend:
    image: ${DOCKER_USERNAME:-hamidrezafalahi}/shop-frontend:${FRONTEND_IMAGE_TAG}
    container_name: shop-frontend-prod
    env_file:
      - .env
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - shop-network-prod
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 256M
          cpus: "0.25"
  # ─── Nginx ─────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: shop-nginx-prod
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_SSL_PORT:-443}:443"
    env_file:
      - .env
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d/production.conf:/etc/nginx/templates/default.conf.template:ro
      - ./docker/nginx/entrypoint/16-ssl-cert.envsh:/docker-entrypoint.d/16-ssl-cert.envsh:ro
      - ./nginx_configs/ssl-dhparams.pem:/etc/nginx/ssl-dhparams.pem:ro
      - ssl-fallback:/etc/nginx/ssl-fallback:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
      - uploads_prod:/var/www/uploads:ro
      - nginx-cache:/data/nginx/cache
      - nginx-logs:/var/log/nginx
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
      ssl_bootstrap:
        condition: service_completed_successfully
    networks:
      - shop-network-prod
    restart: unless-stopped
    stop_grace_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.3"
  # ─── SSL bootstrap: self-signed fallback so nginx starts before the first LE cert ─
  ssl_bootstrap:
    image: alpine:3.20
    container_name: shop-ssl-bootstrap
    volumes:
      - ssl-fallback:/ssl
    command: >
      sh -c '
        [ -s /ssl/fullchain.pem ] && exit 0;
        apk add --no-cache openssl >/dev/null &&
        openssl req -x509 -nodes -newkey rsa:2048 -days 3650 -subj "/CN=${DOMAIN_NAME}" -keyout /ssl/privkey.pem -out /ssl/fullchain.pem &&
        cp /ssl/fullchain.pem /ssl/chain.pem
      '
    restart: "no"
  # ─── Certbot: first issuance (webroot, nginx must be running) ─────────────
  # ./init-ssl.sh
  certbot_init:
    container_name: shop-certbot-init
    image: certbot/certbot:latest
    profiles:
      - init-certs
    env_file:
      - .env
    command: >-
      certonly
      --webroot
      -w /var/www/certbot
      --cert-name ${DOMAIN_NAME}
      -d ${DOMAIN_NAME}
      -d www.${DOMAIN_NAME}
      -m ${CERTBOT_EMAIL}
      --agree-tos
      --non-interactive
      --keep-until-expiring
      --expand
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    networks:
      - shop-network-prod
    restart: "no"
  # ─── Certbot (SSL auto-renewal) ───────────────────────────────────────────
  certbot_renew:
    image: certbot/certbot:latest
    container_name: shop-certbot-renew
    depends_on:
      nginx:
        condition: service_started
    entrypoint: /bin/sh
    command: -c "while :; do certbot renew --webroot -w /var/www/certbot; sleep ${RENEW_INTERVAL:-12h}; done"
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    networks:
      - shop-network-prod
    restart: unless-stopped
  nginx_reloader:
    image: alpine:3.20
    container_name: nginx_reloader
    depends_on:
      - nginx
    volumes:
      - letsencrypt:/etc/letsencrypt:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - shop-network-prod
    command: >
      sh -c '
        apk add --no-cache inotify-tools docker-cli >/dev/null;
        while [ ! -d /etc/letsencrypt/live ]; do
          inotifywait -qq -t 300 -e create /etc/letsencrypt;
          if [ -d /etc/letsencrypt/live ]; then
            sleep 10;
            echo "first cert issued: restarting nginx";
            docker restart shop-nginx-prod >/dev/null 2>&1 || true;
          fi;
        done;
        while :; do
          inotifywait -qq -e create,modify,delete,move -r /etc/letsencrypt/live || sleep 30;
          sleep 10;
          echo "certs changed: restarting nginx";
          docker restart shop-nginx-prod >/dev/null 2>&1 || true;
        done
      '
    restart: unless-stopped
networks:
  shop-network-prod:
    name: shop-network-prod
    driver: bridge
volumes:
  postgres_data_prod:
    name: shop-postgres-data-prod
  uploads_prod:
    name: shop-uploads-prod
  backups_prod:
    name: shop-backups-prod
  letsencrypt:
    name: shop-letsencrypt
  certbot-webroot:
    name: shop-certbot-webroot
  ssl-fallback:
    name: shop-ssl-fallback
  nginx-cache:
    name: shop-nginx-cache
  nginx-logs:
    name: shop-nginx-logs
